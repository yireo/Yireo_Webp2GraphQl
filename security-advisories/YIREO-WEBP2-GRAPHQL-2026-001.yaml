aliases: []
summary: Unauthenticated url_webp GraphQL requests trigger on-demand image conversion (denial of service)
details: >
  The url_webp GraphQL field resolver converted product images to WebP during the GraphQL request
  itself. Because product media queries are available to anonymous visitors, an unauthenticated
  attacker could send many requests to force repeated image conversions, exhausting CPU and disk
  space on the server. Conversion failures were thrown as exceptions, which leaked server file
  paths in the GraphQL response and flooded the exception log. Version 1.0.6 no longer converts
  images during a request: the resolver only returns the URL of an existing, up-to-date WebP image
  and returns null otherwise. It also checks that both Yireo_NextGenImages and Yireo_Webp2 are
  enabled, and confines source and target paths to pub/media and pub/static.
